name: build-armv7-soft
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup target add armv7-unknown-linux-musleabi
          pip install ziglang cargo-zigbuild
          cargo zigbuild --release -p wrtg --target armv7-unknown-linux-musleabi
          readelf -A target/armv7-unknown-linux-musleabi/release/wrtg | head -20
          ls -l target/armv7-unknown-linux-musleabi/release/wrtg
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/armv7-unknown-linux-musleabi/release/wrtg wrtg-armv7-soft
          gh release create softfloat-1 wrtg-armv7-soft --title softfloat-1 --notes "armv7 soft-float" || gh release upload softfloat-1 wrtg-armv7-soft --clobber
