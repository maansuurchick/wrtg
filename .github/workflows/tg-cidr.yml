name: tg-cidr
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cidr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsS https://core.telegram.org/resources/cidr.txt | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/[0-9]+$' | sort -u > tg-cidr4.txt
          test "$(wc -l < tg-cidr4.txt)" -ge 5
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add tg-cidr4.txt
          git diff --cached --quiet || (git commit -m "update tg cidr" && git push)
