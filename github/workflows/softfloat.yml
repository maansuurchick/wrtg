name: build-armv7-soft
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup target add armv7-unknown-linux-musleabi
          pip install ziglang cargo-zigbuild
          cargo zigbuild --release -p wrtg --target armv7-unknown-linux-musleabi
          readelf -A target/armv7-unknown-linux-musleabi/release/wrtg | head -20
          ls -l target/armv7-unknown-linux-musleabi/release/wrtg
      - uses: actions/upload-artifact@v4
        with:
          name: wrtg-armv7-soft
          path: target/armv7-unknown-linux-musleabi/release/wrtg
